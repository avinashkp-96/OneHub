name: Admin Web CI

on:
  push:
    branches: [main, develop]
    paths: ['apps/admin-web/**']
  pull_request:
    branches: [main, develop]
    paths: ['apps/admin-web/**']

defaults:
  run:
    working-directory: apps/admin-web

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/admin-web/package-lock.json }
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/admin-web/package-lock.json }
      - run: npm ci
      - run: npm run test:cov
      - name: Enforce coverage floor
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json').total.lines.pct;
            if (s < 85) { console.error('Line coverage ' + s + '% is below the 85% floor'); process.exit(1); }
          "

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: npm audit
        working-directory: apps/admin-web
        run: npm audit --audit-level=high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/admin-web/package-lock.json }
      - run: npm ci
      - run: npm run build

  auto-issue-on-failure:
    if: failure() && github.ref == 'refs/heads/main'
    needs: [lint, test, security, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Admin Web CI failed on main: ${context.sha.slice(0, 7)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure'],
            });
