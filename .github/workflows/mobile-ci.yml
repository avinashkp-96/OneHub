name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths: ['apps/customer-app/**', 'apps/provider-app/**', 'packages/shared-flutter/**']
  pull_request:
    branches: [main, develop]
    paths: ['apps/customer-app/**', 'apps/provider-app/**', 'packages/shared-flutter/**']
  # Manual builds for installing on a phone. Only offered in the Actions tab
  # once this file is on the default branch (main).
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API the APKs call, e.g. http://192.168.1.10:3000/api/v1'
        required: false

jobs:
  analyze-and-test:
    strategy:
      matrix:
        app: [apps/customer-app, apps/provider-app]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Enforce coverage floor
        run: |
          sudo apt-get install -y lcov
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep lines | grep -oP '\d+\.\d+(?=%)')
          awk -v c="$COVERAGE" 'BEGIN { if (c < 85) { print "Line coverage " c "% is below the 85% floor"; exit 1 } }'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [analyze-and-test, security]
    strategy:
      matrix:
        app: [apps/customer-app, apps/provider-app]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      # The API address is baked in at build time: the run input, else the
      # DEV_API_BASE_URL repository variable, else the app's emulator default.
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.DEV_API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            flutter build apk --debug
          fi
      - name: Name the APK artifact
        run: echo "APP_NAME=$(basename '${{ matrix.app }}')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: onehub-${{ env.APP_NAME }}-debug-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  auto-issue-on-failure:
    if: failure() && github.ref == 'refs/heads/main'
    needs: [analyze-and-test, security, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Mobile CI failed on main: ${context.sha.slice(0, 7)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure'],
            });
